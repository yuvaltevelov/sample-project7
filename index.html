<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14">
<title>Intelligence Hub</title>
<style>
:root{--bg:#070b14;--b2:#0d1424;--g:rgba(18,27,47,.76);--l:rgba(255,255,255,.1);--t:#f6f8fc;--m:#98a6bc;--a:#7aaaff;--mi:#79e2cf;--r:#ff7b88;--y:#f3c36c;--ok:#72d6a5}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--t);background:radial-gradient(circle at 85% 0,#18274f 0,transparent 34%),radial-gradient(circle at 15% 100%,#123530 0,transparent 38%),linear-gradient(155deg,var(--bg),var(--b2));background-attachment:fixed}button,input,select{font:inherit}.side{position:fixed;right:16px;top:16px;bottom:16px;width:245px;padding:15px;border:1px solid var(--l);border-radius:26px;background:var(--g);backdrop-filter:blur(24px);display:flex;flex-direction:column;box-shadow:0 30px 80px #0006}.brand{display:flex;gap:10px;align-items:center;padding:4px 3px 15px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#7aaaff44,#79e2cf22);border:1px solid #7aaaff44;font-weight:900}.brand b{display:block}.brand small{color:var(--m)}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;color:var(--m);padding:10px;border-radius:12px;text-align:right}.nav button.active,.nav button:hover{background:#ffffff0b;color:var(--t)}.foot{margin-top:auto;border:1px solid var(--l);padding:10px;border-radius:13px;color:var(--m);font-size:10px}.main{margin-right:278px;padding:18px 20px 90px}.top{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding-bottom:13px}.search,.ico{border:1px solid var(--l);background:var(--g);color:var(--m);border-radius:14px;backdrop-filter:blur(20px)}.search{flex:1;max-width:650px;padding:11px;text-align:right}.ico{width:42px}.page{display:none}.page.on{display:block;animation:in .2s ease}@keyframes in{from{opacity:0;transform:translateY(4px)}}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 0 20px}.head h1{font-size:clamp(28px,3vw,42px);margin:0;letter-spacing:-.04em}.head p{color:var(--m);margin:6px 0 0;font-size:12px;max-width:690px}.demo,.tag,.pill{border:1px solid var(--l);border-radius:999px;padding:4px 8px;font-size:9px}.demo{color:var(--y);background:#f3c36c10;white-space:nowrap}.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{border:1px solid var(--l);border-radius:21px;background:linear-gradient(145deg,var(--g),#ffffff05);backdrop-filter:blur(22px);overflow:hidden;box-shadow:0 18px 50px #0002}.pad{padding:15px}.metric{min-height:120px}.metric small,.muted{color:var(--m)}.metric .n{font-size:29px;font-weight:800;margin:15px 0 2px}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 9px}.section h2{font-size:16px;margin:0}.list{display:flex;flex-direction:column}.row{display:grid;gap:10px;align-items:center;padding:13px 15px;border-bottom:1px solid var(--l)}.row:last-child{border-bottom:0}.row b{font-size:11px}.row p{margin:3px 0 0;color:var(--m);font-size:9px;line-height:1.5}.change{grid-template-columns:85px 1fr auto}.mail{grid-template-columns:40px 1fr auto}.mailIcon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#7aaaff12}.pri{font-size:8px;border-radius:999px;padding:4px 7px}.high{color:var(--r);background:#ff7b8812}.med{color:var(--y);background:#f3c36c12}.ok{color:var(--ok);background:#72d6a512}.btn{border:1px solid var(--l);background:#ffffff08;color:var(--t);padding:7px 9px;border-radius:10px;font-size:9px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}.filters input,.filters select{border:1px solid var(--l);background:var(--g);color:var(--t);border-radius:11px;padding:8px 10px}.intel h3,.opp h3{font-size:13px;margin:8px 0}.why,.field{border:1px solid var(--l);background:#ffffff05;border-radius:12px;padding:9px;margin-top:8px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.market{grid-template-columns:90px 1fr 75px 1fr}.ltr{direction:ltr}.up{color:var(--ok)}.down{color:var(--r)}.flow{display:flex;align-items:center;gap:7px;overflow:auto;direction:ltr;padding:15px}.node{white-space:nowrap;border:1px solid var(--l);background:#ffffff06;border-radius:11px;padding:8px 10px;font-size:9px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:100px;border:1px solid var(--l);border-radius:13px;padding:8px;background:#ffffff04}.event{margin-top:7px;padding:6px;border-radius:8px;background:#7aaaff14;border:1px solid #7aaaff24;font-size:8px}.task{display:flex;gap:10px}.task.done{opacity:.5}.task.done b{text-decoration:line-through}.check{width:24px;height:24px;border-radius:8px;border:1px solid var(--l);background:#ffffff06;color:var(--ok)}.ask{max-width:850px;margin:auto}.askHero{text-align:center;padding:28px}.orb{width:60px;height:60px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center;background:linear-gradient(145deg,#7aaaff35,#79e2cf20);font-size:22px}.askBox{display:flex;gap:6px;border:1px solid var(--l);background:#ffffff06;border-radius:15px;padding:6px}.askBox input{flex:1;border:0;background:transparent;color:var(--t);outline:0;padding:9px}.mobile{display:none}.toast{position:fixed;left:14px;bottom:14px;background:var(--g);border:1px solid var(--l);border-radius:12px;padding:10px 12px;opacity:0;transform:translateY(8px);transition:.2s;z-index:99}.toast.show{opacity:1;transform:none}
@media(max-width:1050px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.market{grid-template-columns:75px 1fr 65px}.market .whyCell{display:none}}
@media(max-width:800px){.side{display:none}.main{margin-right:0;padding:12px 10px 88px}.g2,.g3{grid-template-columns:1fr}.mail{grid-template-columns:38px 1fr}.mail>span:last-child{grid-column:2}.cal{grid-template-columns:repeat(2,1fr)}.mobile{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:8px;right:8px;bottom:8px;padding:5px;border:1px solid var(--l);border-radius:18px;background:rgba(18,27,47,.92);backdrop-filter:blur(24px);z-index:50}.mobile button{border:0;background:transparent;color:var(--m);padding:7px 2px;border-radius:11px;font-size:8px}.mobile button.active{color:var(--t);background:#ffffff0b}}
@media(max-width:520px){.g4{gap:8px}.metric{min-height:105px}.pad{padding:12px}.head{align-items:flex-start}.head h1{font-size:29px}.change{grid-template-columns:68px 1fr}.change>span:last-child{grid-column:2}.market{grid-template-columns:62px 1fr 58px}}
</style></head>
<body><aside class="side"><div class="brand"><div class="logo">IH</div><div><b>Intelligence Hub</b><small>Personal Signal OS</small></div></div><div id="nav" class="nav"></div><div class="foot"><b style="color:var(--t)">Connectors</b><br>Gmail · Calendar · News · Markets<br><span style="color:var(--y)">● Demo Mode</span></div></aside><main class="main"><div class="top"><button class="search" onclick="go('ask')">⌕ שאל או חפש בכל המערכת</button><button class="ico" onclick="toast('Theme toggle יתווסף בגרסה הבאה')">☼</button></div><div id="pages"></div></main><div id="mobile" class="mobile"></div><div id="toast" class="toast"></div>
<script>
const nav=[['home','⌂ בית'],['inbox','✉ Inbox'],['news','◉ News'],['markets','↗ Markets'],['calendar','▦ יומן'],['pac','P PAC'],['tasks','✓ משימות'],['opps','◇ הזדמנויות'],['saved','☆ Research'],['ask','✦ Ask AI']];
const mails=[['PAC','high','המרכז האקדמי פרס','עדכון לגבי כיתת בחינה','שינוי לוגיסטי שדורש בדיקה לפני הבחינה.'],['אבטחה','critical','Google','Security alert','אירוע אבטחה מקבל עדיפות מיידית.'],['קניות','medium','KSP','הזמנה מוכנה לאיסוף','חלון איסוף מוגבל.'],['עבודה','high','מערכת משמרות','סידור עבודה חדש','בדוק התנגשויות מול לימודים ויומן.'],['טכנולוגיה','medium','Cursor','Cloud pricing update','רלוונטי ל-Agent workflows.']];
const intel=[['AI Infrastructure','ביקוש לתשתיות AI ממשיך להתרחב','CapEx עשוי להשפיע על שבבים, רשתות, קירור וחשמל.',['NVDA','SMH','Data Centers','Power']],['Energy','Data Centers מעלים ביקוש לחשמל','השפעה אפשרית על Grid, Nuclear, Gas, Solar ו-Batteries.',['Grid','Nuclear','Gas','Batteries']],['Macro','שינוי בציפיות הריבית משנה תמחור נכסים','תשואות, דולר, זהב ומניות צמיחה מגיבים לשינוי בציפיות.',['QQQM','USD','XAU/USD','Bonds']],['Science','AI מאיץ גילוי חומרים ותרופות','פוטנציאל להשפיע על ביוטק, Materials ו-Drug Discovery.',['Biotech','AI','Materials']]];
const mk=[['QQQM','248.31','+0.7%','AI / rates'],['SMH','391.44','-1.2%','Semis / Taiwan'],['NVDA','183.70','+1.4%','AI demand'],['BTC','116,420','+2.1%','Liquidity'],['XAU/USD','3,664','-0.5%','USD / yields'],['Oil','67.40','+0.6%','Supply / geopolitics']];
let tasks=[['בדוק הודעות PAC','PAC',0],['בדוק את הסידור מול היומן','עבודה',0],['מעקב אחרי תשובה שנשלחה','Waiting',0],['שמור מחקר AI infrastructure','Research',1]];
const h=(t,s)=>`<div class="head"><div><h1>${t}</h1><p>${s}</p></div><span class="demo">DEMO · connector-ready</span></div>`,p=(id,x)=>`<section id="${id}" class="page">${x}</section>`;
function mail(m){return `<div class="row mail" data-cat="${m[0]}"><div class="mailIcon">✉</div><div><b>${m[2]}</b><div style="font-size:10px">${m[3]}</div><p>${m[4]}</p><div class="actions"><button class="btn" onclick="toast('נוצרה פעולה מקומית')">צור פעולה</button><button class="btn" onclick="toast('נשמר למחקר')">שמור</button></div></div><span class="pri ${m[1]==='critical'?'high':m[1]==='high'?'med':'ok'}">${m[1]}</span></div>`}
function home(){return p('home',h('בוקר טוב יובל','רק מה השתנה, מה דורש פעולה ומה באמת שווה את תשומת הלב שלך.')+`<div class="grid g4">${[['דורש פעולה','4'],['היום ביומן','3'],['PAC','2'],['Watchlist','6']].map(x=>`<div class="card pad metric"><small>${x[0]}</small><div class="n">${x[1]}</div><small>נתוני הדגמה</small></div>`).join('')}</div><div class="section"><h2>מה השתנה מאז אתמול</h2><small class="muted">Signal, not noise</small></div><div class="card list">${intel.slice(0,3).map(e=>`<div class="row change"><span class="tag">${e[0]}</span><div><b>${e[1]}</b><p>${e[2]}</p></div><span class="pill med">Analysis</span></div>`).join('')}</div><div class="section"><h2>דורש פעולה</h2><button class="btn" onclick="go('inbox')">פתח Inbox</button></div><div class="card list">${mails.slice(0,3).map(mail).join('')}</div>`)}
function inbox(){return p('inbox',h('Smart Inbox','מיילים לפי משמעות ופעולה, לא לפי סדר הגעה.')+`<div class="filters"><input id="q" placeholder="חיפוש"><select id="cat"><option value="all">כל הקטגוריות</option>${[...new Set(mails.map(m=>m[0]))].map(c=>`<option>${c}</option>`).join('')}</select></div><div id="mailList" class="card list">${mails.map(mail).join('')}</div>`)}
function news(){return p('news',h('News Intelligence','אירועים מאוחדים במקום עשרות כתבות כפולות.')+`<div class="grid g2">${intel.map(e=>`<div class="card pad intel"><span class="tag">${e[0]}</span><h3>${e[1]}</h3><div class="why"><b>למה זה חשוב</b><p class="muted" style="font-size:10px">${e[2]}</p></div><div class="chips">${e[3].map(x=>`<span class="tag ltr">${x}</span>`).join('')}</div></div>`).join('')}</div><div class="section"><h2>Impact Chain</h2></div><div class="card flow"><span class="node">Taiwan</span>→<span class="node">TSMC</span>→<span class="node">Chip supply</span>→<span class="node">NVDA / AMD</span>→<span class="node">SMH</span></div>`)}
function markets(){return p('markets',h('Markets','Watchlist עם Context. המחירים הם Demo בלבד.')+`<div class="card list">${mk.map(x=>`<div class="row market"><b class="ltr">${x[0]}</b><span class="ltr">${x[1]}</span><span class="ltr ${x[2][0]=='+'?'up':'down'}">${x[2]}</span><div class="whyCell"><b>Why moving?</b><p>${x[3]}</p></div></div>`).join('')}</div><div class="section"><h2>Macro Cause & Effect</h2></div><div class="card flow"><span class="node">CPI ↑</span>→<span class="node">Cuts ↓</span>→<span class="node">Yields ↑</span>→<span class="node">Growth pressure</span>→<span class="node">USD / Gold</span></div>`)}
function calendar(){let ds=['א׳ 20','ב׳ 21','ג׳ 22','ד׳ 23','ה׳ 24','ו׳ 25','ש׳ 26'];return p('calendar',h('Calendar Intelligence','מייל, PAC ומשימה יכולים להפוך לאירוע. Google Calendar עדיין לא מחובר.')+`<div class="card pad"><div class="cal">${ds.map((d,i)=>`<div class="day"><b>${d}</b>${i==2?'<div class="event">בחינה / PAC<br>Intelligence Hub</div>':''}${i==4?'<div class="event">משימה חשובה</div>':''}</div>`).join('')}</div></div>`)}
function pac(){return p('pac',h('PAC Hub','בחינות, מטלות, הודעות וקריירה במקום אחד.')+`<div class="grid g3">${[['בחינות','סטטיסטיקה למנע״ס'],['דדליינים','מטלה קרובה'],['Career','משרות חמות']].map(x=>`<div class="card pad"><span class="tag">${x[0]}</span><h3>${x[1]}</h3><p class="muted" style="font-size:10px">מקושר ל-Inbox, Tasks ו-Calendar.</p></div>`).join('')}</div>`)}
function taskCard(t,i){return `<div class="card pad task ${t[2]?'done':''}"><button class="check" onclick="toggle(${i})">${t[2]?'✓':''}</button><div><span class="tag">${t[1]}</span><b style="display:block;margin-top:8px">${t[0]}</b></div></div>`}
function tasksPage(){return p('tasks',h('Tasks','Needs Action, Waiting ו-Completed.')+`<div id="tasks" class="grid g2">${tasks.map(taskCard).join('')}</div>`)}
function opps(){let o=[['AI compliance','Policy + monitoring layer','SaaS + integration'],['Data-center energy','Optimization dashboard','Enterprise subscription'],['Legacy automation','AI agents + workflows','Project + support']];return p('opps',h('Opportunity Engine','הופך שינוי בעולם לבעיה, פתרון ומודל עסקי.')+`<div class="grid g3">${o.map(x=>`<div class="card pad opp"><span class="tag">Generated Demo</span><h3>${x[0]}</h3><div class="field"><b>Possible solution</b><p>${x[1]}</p></div><div class="field"><b>Business model</b><p>${x[2]}</p></div></div>`).join('')}</div>`)}
function saved(){return p('saved',h('Saved & Research','אוספים שמקשרים חדשות, נכסים, מיילים ורעיונות.')+`<div class="grid g3">${['AI','Investments','Business Ideas','Studies','Poland','Real Estate','Research'].map(x=>`<div class="card pad"><span class="tag">Collection</span><h3>${x}</h3><p class="muted" style="font-size:10px">פריטי דמו שמורים</p></div>`).join('')}</div>`)}
function ask(){return p('ask',`<div class="ask"><div class="card askHero"><div class="orb">✦</div><h2>Ask Intelligence</h2><p class="muted">חיפוש מקומי על נתוני הדמו. Connectors יהפכו אותו לחיפוש חי.</p><div class="askBox"><input id="askInput" placeholder="למשל: מה יכול להשפיע על הזהב?"><button class="btn" onclick="runAsk()">שאל</button></div><div class="actions" style="justify-content:center"><button class="btn" onclick="preset('פרס')">מה פספסתי מפרס?</button><button class="btn" onclick="preset('זהב')">מה משפיע על הזהב?</button><button class="btn" onclick="preset('AI')">מה קרה ב-AI?</button></div></div><div id="res"></div></div>`)}
function render(){document.getElementById('nav').innerHTML=nav.map(x=>`<button data-go="${x[0]}">${x[1]}</button>`).join('');document.getElementById('mobile').innerHTML=nav.slice(0,4).concat([nav[9]]).map(x=>`<button data-go="${x[0]}">${x[1]}</button>`).join('');document.getElementById('pages').innerHTML=home()+inbox()+news()+markets()+calendar()+pac()+tasksPage()+opps()+saved()+ask();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));bind();go(location.hash.slice(1)||'home')}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(id)?.classList.add('on');document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go==id));history.replaceState(null,'','#'+id);scrollTo(0,0)}
function bind(){let q=document.getElementById('q'),c=document.getElementById('cat');const f=()=>document.querySelectorAll('#mailList .mail').forEach((r,i)=>r.style.display=((!q.value||r.textContent.includes(q.value))&&(c.value=='all'||mails[i][0]==c.value))?'grid':'none');q.oninput=f;c.onchange=f}
function toggle(i){tasks[i][2]=tasks[i][2]?0:1;document.getElementById('tasks').innerHTML=tasks.map(taskCard).join('');localStorage.setItem('ihTasks',JSON.stringify(tasks));toast('סטטוס עודכן')}
function preset(x){document.getElementById('askInput').value=x;runAsk()}
function runAsk(){let q=document.getElementById('askInput').value.toLowerCase(),out=[];if(q.includes('פרס')||q.includes('pac'))out.push(['PAC','עדכון לגבי כיתת בחינה','בדוק את הודעות המרכז האקדמי והכיתה המעודכנת.']);if(q.includes('זהב')||q.includes('gold'))out.push(['Markets','XAU/USD','רגיש לדולר, תשואות, ציפיות ריבית וסיכון גיאופוליטי.']);if(q.includes('ai'))out.push(['News','AI Infrastructure',intel[0][2]]);document.getElementById('res').innerHTML=out.length?`<div class="card list" style="margin-top:12px">${out.map(x=>`<div class="row"><span class="tag">${x[0]}</span><div><b>${x[1]}</b><p>${x[2]}</p></div></div>`).join('')}</div>`:`<div class="card pad muted" style="margin-top:12px">לא נמצאה התאמה בנתוני הדמו.</div>`}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
try{let s=JSON.parse(localStorage.getItem('ihTasks'));if(s)tasks=s}catch{}render();
</script></body></html>
